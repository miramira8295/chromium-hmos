name: Module cache isolated validation
on:
  push:
    branches: [ci/module-cache-validation-155]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chromium-build-${{ github.repository }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, harmonyos-chromium]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Link and execute host V8 module cache probes
        run: |
          set -euo pipefail
          mkdir -p validation
          python3 scripts/run-host-v8-module-cache.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-cache-validation
          path: |
            validation/
            !validation/host-v8/probe
            !validation/host-v8/probe.o
          retention-days: 7
