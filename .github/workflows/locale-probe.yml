name: Locale resource probe
on:
  push:
    branches: [debug/locale-resource-probe-20261029]
    paths:
      - 'patches/ohos-locale-resource-diagnostics.patch'
      - '.github/workflows/locale-probe.yml'
      - 'scripts/ci-incremental-build.sh'
concurrency:
  group: chromium-build-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, harmonyos-chromium]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build diagnostic engine
        env:
          CHROMIUM_SRC: /root/chromium-154/src
          NINJA_JOBS: '12'
          SKIP_HAP: '1'
          PROGRESS_EVERY: '10'
        shell: bash
        run: |
          # Leave the shared source tree without this temporary instrumentation.
          cleanup_probe() {
            if git -C "$CHROMIUM_SRC" apply --reverse --check "$GITHUB_WORKSPACE/patches/ohos-locale-resource-diagnostics.patch"; then
              git -C "$CHROMIUM_SRC" apply --reverse "$GITHUB_WORKSPACE/patches/ohos-locale-resource-diagnostics.patch"
            fi
          }
          trap cleanup_probe EXIT
          bash scripts/ci-incremental-build.sh
          mkdir -p probe-artifact
          cp "$(cat build-status/har-path.txt)" probe-artifact/engine.har
          cp build-status/latest.json probe-artifact/
          sha256sum probe-artifact/engine.har
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locale-resource-probe-${{ github.sha }}
          path: |
            probe-artifact/
            build-status/errors.txt
            build-status/latest.json
          retention-days: 7
          compression-level: 0
