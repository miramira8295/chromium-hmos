<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebNN LiteRT (CPU) + OHOS NNRt (NPU) 联合验证</title>
<style>
body{font:16px system-ui;margin:24px;max-width:860px;background:#fafafa;color:#222}
button{font:inherit;padding:12px 20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:16px}
</style>
<h1>WebNN LiteRT (CPU) + OHOS NNRt (NPU) 联合验证</h1>
<p>在 lumie://flags 或命令行开启 <code>WebNN,OhosWebNN</code> 后完整重启。
此页同时验证上游 LiteRT+XNNPACK (<code>deviceType: 'cpu'</code>) 与鸿蒙 NNRt (<code>deviceType: 'npu'</code>) 多算子图推理及数值一致性。</p>
<button id="run">运行验证</button><pre id="result">等待运行</pre>
<script type="module">
const button = document.querySelector('#run'), output = document.querySelector('#result');
const report = { started: null, checks: [] };
window.webnnReport = report;
function record(name, detail) {
  report.checks.push({name, detail, time: new Date().toISOString()});
  output.textContent = JSON.stringify(report, null, 2);
}

async function runMultiOpSuite(deviceType) {
  const context = await navigator.ml.createContext({deviceType});
  const tensors = [];
  let addGraph, dagGraph;
  try {
    const limits = context.opSupportLimits();
    record(`${deviceType}: context created`, {
      preferredInputLayout: limits.preferredInputLayout,
      maxTensorByteLength: limits.maxTensorByteLength,
      inputDataTypes: limits.input?.dataTypes,
      addDataTypes: limits.add?.a?.dataTypes,
      matmulDataTypes: limits.matmul?.a?.dataTypes,
    });

    const shape = [1, 4];
    const desc = {dataType: 'float32', shape};

    // 1. Single-op Add graph (tests 2D shape [1, 4] & NNRt 4D/NCHW promotion)
    {
      const builder = new MLGraphBuilder(context);
      const lhs = builder.input('lhs', desc);
      const rhs = builder.input('rhs', desc);
      addGraph = await builder.build({sum: builder.add(lhs, rhs)});
    }

    // 2. Multi-op DAG graph with constant weights: y = relu(x * scale + bias)
    {
      const builder = new MLGraphBuilder(context);
      const x = builder.input('x', desc);
      const scale = builder.constant(desc, new Float32Array([2.0, 2.0, 2.0, 2.0]));
      const bias = builder.constant(desc, new Float32Array([1.0, 1.0, 1.0, 1.0]));
      const prod = builder.mul(x, scale);
      const shifted = builder.add(prod, bias);
      const activated = builder.relu(shifted);
      dagGraph = await builder.build({y: activated});
    }

    const a = await context.createTensor({...desc, writable: true}); tensors.push(a);
    const b = await context.createTensor({...desc, writable: true}); tensors.push(b);
    const outAdd = await context.createTensor({...desc, readable: true}); tensors.push(outAdd);
    const outDag = await context.createTensor({...desc, readable: true}); tensors.push(outDag);

    const av = new Float32Array([1, -2, 0.25, 1024]);
    const bv = new Float32Array([3, 0.5, -0.125, -512]);
    context.writeTensor(a, av);
    context.writeTensor(b, bv);

    const t0 = performance.now();
    context.dispatch(addGraph, {lhs: a, rhs: b}, {sum: outAdd});
    const addVals = new Float32Array(await context.readTensor(outAdd));
    const addMs = performance.now() - t0;

    const expectedAdd = [4, -1.5, 0.125, 512];
    for (let i = 0; i < expectedAdd.length; ++i) {
      if (!Number.isFinite(addVals[i]) || Math.abs(addVals[i] - expectedAdd[i]) > 1e-4) {
        throw Error(`${deviceType} Add mismatch at ${i}: got ${addVals[i]}, expected ${expectedAdd[i]}`);
      }
    }
    record(`${deviceType}: Add [1,4] passed`, {values: [...addVals], milliseconds: addMs});

    const t1 = performance.now();
    context.dispatch(dagGraph, {x: a}, {y: outDag});
    const dagVals = new Float32Array(await context.readTensor(outDag));
    const dagMs = performance.now() - t1;

    const expectedDag = [3, 0, 1.5, 2049];
    for (let i = 0; i < expectedDag.length; ++i) {
      if (!Number.isFinite(dagVals[i]) || Math.abs(dagVals[i] - expectedDag[i]) > 1e-4) {
        throw Error(`${deviceType} DAG (Mul+Add+Relu) mismatch at ${i}: got ${dagVals[i]}, expected ${expectedDag[i]}`);
      }
    }
    record(`${deviceType}: Multi-op DAG (Mul+Add+Relu) passed`, {values: [...dagVals], milliseconds: dagMs});
    return {addVals: [...addVals], dagVals: [...dagVals]};
  } finally {
    for (const tensor of tensors) tensor.destroy();
    addGraph?.destroy();
    dagGraph?.destroy();
    context.destroy();
  }
}

async function run() {
  button.disabled = true;
  report.started = new Date().toISOString(); report.checks = []; report.result = 'RUNNING';
  try {
    if (!isSecureContext || !navigator.ml) throw Error('需要安全上下文和启用了 WebNN 的新内核');
    const cpuOut = await runMultiOpSuite('cpu');
    const npuOut = await runMultiOpSuite('npu');
    for (let i = 0; i < cpuOut.dagVals.length; ++i) {
      if (Math.abs(cpuOut.dagVals[i] - npuOut.dagVals[i]) > 1e-4) {
        throw Error(`CPU vs NPU numerical drift at ${i}: cpu=${cpuOut.dagVals[i]} npu=${npuOut.dagVals[i]}`);
      }
    }
    record('CPU (LiteRT) vs NPU (NNRt) parity verified', {cpuOut, npuOut});
    report.result = 'PASS';
  } catch (e) {
    report.result = 'FAIL'; report.error = {name: e.name, message: e.message, stack: e.stack};
  } finally {
    report.finished = new Date().toISOString();
    output.textContent = JSON.stringify(report, null, 2); button.disabled = false;
  }
}
button.addEventListener('click', run);
window.runWebnnTest = run;
</script>
